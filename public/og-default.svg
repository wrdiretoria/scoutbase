<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#06100a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1f14;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16a34a;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Decorative circles -->
  <circle cx="1050" cy="120" r="200" fill="#22c55e" opacity="0.04" />
  <circle cx="150" cy="520" r="150" fill="#22c55e" opacity="0.04" />
  <circle cx="600" cy="315" r="400" fill="#22c55e" opacity="0.02" />

  <!-- Green accent bar -->
  <rect x="80" y="200" width="6" height="230" fill="url(#accent)" rx="3" />

  <!-- Logo / Brand -->
  <text x="110" y="260" font-family="Arial Black, Arial, sans-serif" font-size="72" font-weight="900" fill="#22c55e" letter-spacing="-2">MEU CRAQUE</text>

  <!-- Tagline -->
  <text x="110" y="330" font-family="Arial, sans-serif" font-size="32" fill="#bbf7d0" opacity="0.9">Perfil Oficial de Atleta de Futebol</text>

  <!-- Description -->
  <text x="110" y="390" font-family="Arial, sans-serif" font-size="24" fill="#86efac" opacity="0.7">Crie seu perfil · Receba avaliações · Seja descoberto</text>

  <!-- Pills -->
  <rect x="110" y="430" width="180" height="44" rx="22" fill="#22c55e" opacity="0.15" />
  <text x="200" y="458" font-family="Arial, sans-serif" font-size="18" fill="#22c55e" text-anchor="middle">🏆 Ranking</text>

  <rect x="310" y="430" width="220" height="44" rx="22" fill="#22c55e" opacity="0.15" />
  <text x="420" y="458" font-family="Arial, sans-serif" font-size="18" fill="#22c55e" text-anchor="middle">🔍 Scout busca</text>

  <rect x="550" y="430" width="240" height="44" rx="22" fill="#22c55e" opacity="0.15" />
  <text x="670" y="458" font-family="Arial, sans-serif" font-size="18" fill="#22c55e" text-anchor="middle">⚽ Perfil grátis</text>

  <!-- URL -->
  <text x="110" y="560" font-family="Arial, sans-serif" font-size="22" fill="#4ade80" opacity="0.6">meucraque.com.br</text>

  <!-- Ball icon (right side) -->
  <circle cx="980" cy="315" r="140" fill="none" stroke="#22c55e" stroke-width="3" opacity="0.15" />
  <circle cx="980" cy="315" r="100" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.1" />
  <text x="980" y="355" font-family="Arial, sans-serif" font-size="120" text-anchor="middle" opacity="0.2">⚽</text>
</svg>
